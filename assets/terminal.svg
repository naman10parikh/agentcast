<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">agentcast --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">agentcast 0.1.0 — reusable sub-agent personas for Claude Code, validated and scored</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">Usage:</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">  agentcast list                          the library: id, what it does, its tools</text>
<text x="24" y="166" fill="#d8d3c8" xml:space="preserve">  agentcast show &lt;id&gt;                     print a library persona</text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">  agentcast add &lt;id&gt; [--dir=.claude/agents] [--force]</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">                                          copy a persona into a project, then validate it</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">  agentcast validate [--dir &lt;path&gt; | --file &lt;path&gt; | --library]</text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve">                                          check personas against what Claude Code reads</text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">  agentcast score [--dir &lt;path&gt; | --file &lt;path&gt; | --library]</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">                                          score personas on a 10-point rubric (pass at 7)</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">  agentcast dispatch [--json] &quot;&lt;task&gt;&quot;    pick the best persona for a task</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">  agentcast trial &lt;file|id&gt; [--sandbox=e2b] [--json]</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">                                          list what a persona can do; with E2B, run the commands it carries</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">  agentcast recall &quot;&lt;query&gt;&quot;              search agentcast's own memory and library</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">  agentcast --version | --help</text>
<text x="24" y="406" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">MCP server: agentcast-mcp (persona_dispatch, persona_get, persona_validate, persona_score)</text>
</svg>
