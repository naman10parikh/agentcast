name: Improve
# The improvement loop: every night, re-run the tests and evals, and compare the sub-agent fields the validator
# knows with Claude Code's own documentation. Drift becomes an issue with a proposed change.
# It opens issues only; a person reviews and lands every change.
on:
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
      - run: npm run eval
      - name: Compare frontmatter fields with the docs
        id: drift
        run: |
          set +e
          node scripts/field-drift.mjs --out proposal.md
          code=$?
          if [ "$code" -eq 3 ]; then echo "drift=true" >> "$GITHUB_OUTPUT"; elif [ "$code" -ne 0 ]; then exit "$code"; fi
      - name: Open a proposal issue
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="agentcast: Claude Code's sub-agent fields changed"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$open" = "0" ]; then gh issue create --title "$title" --body-file proposal.md; fi
