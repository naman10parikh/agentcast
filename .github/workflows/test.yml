name: Test

on: [push, pull_request]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run tests
        run: npm test
      - name: Validate the library
        run: node validator/validate.mjs --library
      - name: Run agentcast eval
        run: npm run eval # the rubric over every persona, then the golden validator and routing cases
      - name: Check this repository's own sub-agents
        run: node bin/agentcast.mjs validate --dir .claude/agents
